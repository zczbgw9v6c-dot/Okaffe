<style>
:root{
  --green:#51634C; --green-deep:#3F4E3B; --on-green:#FAF8F2; --on-green-dim:#D5DCCF;
  --bg:#F1F3EC; --surface:#FFFFFF; --ink:#1D251B; --muted:#57614F; --line:#D9DED2; --soft:#E5EAE0;
  --brass:#D2B06A; --brass-ink:#2B2208; --wa:#1A8F49; --danger:#A8281F; --paper:#FFFDF6; --paper-ink:#1A1A1A;
  --display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --body:"Montserrat","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131912; --surface:#1C241A; --ink:#EEF1E8; --muted:#A9B4A2; --line:#2F3A2C; --soft:#263023;
    --green:#51634C; --green-deep:#2C382A;
  }
}
:root[data-theme="dark"]{
  --bg:#131912; --surface:#1C241A; --ink:#EEF1E8; --muted:#A9B4A2; --line:#2F3A2C; --soft:#263023;
  --green:#51634C; --green-deep:#2C382A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px} /* évite le zoom automatique d'iOS */
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:6px}
img{max-width:100%;display:block}
[hidden]{display:none!important}
.cap{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--green);z-index:60}

/* en-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--green);color:var(--on-green)}
.top-in{max-width:980px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:10px}
.logo{height:34px;width:auto;margin-right:auto}
.langs{display:flex;border:1px solid rgba(250,248,242,.45);border-radius:999px;overflow:hidden}
.langs button{border:0;background:none;padding:6px 9px;font-size:12px;font-weight:600;color:var(--on-green)}
.langs button[aria-pressed="true"]{background:var(--on-green);color:var(--green-deep)}
.ring{position:relative;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--on-green);background:none;display:grid;place-items:center;color:var(--on-green);flex:none}
.ring svg{width:19px;height:19px}
.ring b{position:absolute;top:-6px;right:-6px;min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--brass);color:var(--brass-ink);font-size:12px;line-height:21px;text-align:center}
.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.16)}}
.switch{max-width:980px;margin:0 auto;padding:10px 16px 0;display:grid;grid-template-columns:1fr 1fr}
.switch button{border:0;background:none;color:var(--on-green-dim);padding:9px 4px 11px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;transition:color .2s,border-color .2s}
.switch button[aria-pressed="true"]{color:var(--on-green);border-bottom-color:var(--on-green)}

/* bandeau de section */
.intro{background:var(--green);color:var(--on-green);position:relative;overflow:hidden}
.intro-in{max-width:980px;margin:0 auto;padding:20px 16px 22px;position:relative}
.intro h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,9vw,52px);letter-spacing:.14em;line-height:1;margin:0;text-transform:uppercase}
.intro p{margin:10px 0 0;max-width:40ch;color:var(--on-green-dim);font-size:14px}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.18);font-size:13px;font-weight:600}
.status i{width:8px;height:8px;border-radius:50%;background:#9BE0A8}
.status.closed i{background:#F0B4A8}
.ginkgo{position:absolute;right:-26px;top:-8px;width:150px;height:150px;opacity:.28;pointer-events:none}

main{max-width:980px;margin:0 auto;padding:0 16px 40px}
.search{width:100%;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);padding:0 18px;margin-top:14px}
.chips-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,102px));z-index:10;background:var(--bg);margin:0 -16px;padding:10px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px;scrollbar-width:none;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}

#list.swap-l{animation:swapl .3s ease}
#list.swap-r{animation:swapr .3s ease}
#list.fade{animation:fadein .25s ease}
@keyframes swapl{from{opacity:0;transform:translateX(28px)}}
@keyframes swapr{from{opacity:0;transform:translateX(-28px)}}
@keyframes fadein{from{opacity:0}}
.group h2{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.16em;text-transform:uppercase;margin:22px 0 2px;color:var(--ink)}
.group .gnote{font-family:var(--display);font-style:italic;font-size:16px;color:var(--muted);margin:2px 0 4px}
.rows{display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.rows{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:36px}}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);min-height:56px}
.row.dish{grid-template-columns:minmax(0,1fr) auto}
.row.off{opacity:.5}
.ph{width:44px;height:44px;border-radius:10px;overflow:hidden;display:grid;place-items:center;font-size:24px;background:var(--soft)}
.ph img{width:100%;height:100%;object-fit:cover}
.row h3{font-size:14.5px;font-weight:600;line-height:1.25;margin:0;overflow-wrap:anywhere}
.sub{margin:1px 0 0;font-size:12.5px;color:var(--muted);line-height:1.35}
.pr{margin:2px 0 0;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.pr s{color:var(--muted);font-weight:500;margin-left:6px}
.add,.step button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--green);background:var(--surface);color:var(--green);font-size:21px;line-height:1;font-weight:500;display:grid;place-items:center;padding:0;flex:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .add,:root:not([data-theme="light"]) .step button{color:var(--ink);border-color:#7C9075}}
:root[data-theme="dark"] .add,:root[data-theme="dark"] .step button{color:var(--ink);border-color:#7C9075}
.add:active,.step button:active{background:var(--green);color:var(--on-green)}
.step{display:flex;align-items:center;gap:3px}
.step button{width:34px;height:34px;font-size:19px}
.step span{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.soldout{font-size:12.5px;font-weight:600;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}

/* infos pratiques */
.info{max-width:980px;margin:10px auto 0;padding:0 16px 130px}
.info-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.info h2{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px}
.hours{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.hours td{padding:5px 0}
.hours td:last-child{text-align:right}
.hours tr.today td{font-weight:700}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.addr{margin:12px 0 0;color:var(--muted);font-size:14px}
.motto{font-family:var(--display);font-style:italic;font-size:20px;text-align:center;color:var(--muted);margin:22px 0 6px}
.foot{display:flex;justify-content:center;margin-top:4px}
.foot button{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:8px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);animation:fadein .25s ease}
.bar button{width:100%;max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;border-radius:16px;background:var(--green);color:var(--on-green);padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 10px 28px -12px rgba(20,30,18,.7)}
.bar small{font-weight:500;opacity:.9;font-size:13px}

/* feuilles plein écran, ouverture et fermeture en fondu */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px);animation:sheetin .28s cubic-bezier(.2,.8,.2,1)}
.sheet.out{animation:sheetout .2s ease forwards}
@keyframes sheetin{from{opacity:0;transform:translateY(18px)}}
@keyframes sheetout{to{opacity:0;transform:translateX(40px)}}
.sheet-in{max-width:560px;margin:0 auto;padding:0 16px 40px}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 0 12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.sheet-head h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0 auto 0 0}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.line h4{margin:0;font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.line .right{display:flex;align-items:center;gap:12px}
.line .pr{margin:0;min-width:58px;text-align:right}
.sec-label{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:16px;color:var(--muted);margin:14px 0 0}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;font-family:var(--display);font-size:26px;font-weight:600}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;min-height:46px}
.field textarea{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:14px 0 4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 6px;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{border-color:var(--green);background:var(--soft);box-shadow:inset 0 0 0 1px var(--green)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;text-decoration:none;margin-top:10px;min-height:48px}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:none;border:1px solid var(--danger);color:var(--danger)}
.contact .btn{margin-top:0}
.err{color:var(--danger);font-size:14px;font-weight:600;margin:10px 0 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#FF9C90}}
.hint{color:var(--muted);font-size:13.5px;margin:8px 0 0}

/* bon de commande : pensé pour la capture d'écran, reste clair même en mode sombre */
.ticket{background:var(--paper);color:var(--paper-ink);padding:26px 20px 28px;margin:6px 0 4px;--r:7px;
  -webkit-mask:radial-gradient(circle at 50% 0,transparent var(--r),#000 calc(var(--r) + .5px)) top/18px 51% repeat-x,radial-gradient(circle at 50% 100%,transparent var(--r),#000 calc(var(--r) + .5px)) bottom/18px 51% repeat-x;
          mask:radial-gradient(circle at 50% 0,transparent var(--r),#000 calc(var(--r) + .5px)) top/18px 51% repeat-x,radial-gradient(circle at 50% 100%,transparent var(--r),#000 calc(var(--r) + .5px)) bottom/18px 51% repeat-x;
  animation:print .5s cubic-bezier(.2,.8,.2,1)}
@keyframes print{from{transform:translateY(-22px);opacity:0}}
.t-brand{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:.12em;text-transform:uppercase;color:#3F4E3B;line-height:1.1}
.t-meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.ticket hr{border:0;border-top:2px dashed #CFCAB8;margin:13px 0}
.t-who{font-size:14px;margin:0}
.t-who b{font-size:16px}
.t-sec{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:#5A5648;margin:8px 0 2px}
.t-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;font-size:14px;padding:4px 0;font-variant-numeric:tabular-nums}
.t-row small{display:block;color:#5A5648;font-size:12.5px}
.t-total{display:flex;justify-content:space-between;font-family:var(--display);font-weight:600;font-size:28px}
.t-foot{font-size:12.5px;color:#5A5648;margin:10px 0 0}
.t-motto{font-family:var(--display);font-style:italic;font-size:19px;text-align:center;color:#3F4E3B;margin:16px 0 0}

/* gérant */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 2px;font-weight:600;font-size:12px;min-height:42px}
.tabs button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.a-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.a-row h4{margin:0;font-size:14.5px;overflow-wrap:anywhere}
.a-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.a-acts button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;min-height:34px}
.a-acts .del{color:var(--danger);border-color:var(--danger)}
.mode{font-size:12.5px;border-radius:10px;padding:8px 12px;margin:0 0 12px;background:var(--soft);color:var(--ink)}
.mode.demo{border:1px dashed var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile span{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.tile b{display:block;font-family:var(--display);font-weight:600;font-size:44px;line-height:1.05}
.tile small{font-size:12.5px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding:10px 4px 0;margin-top:8px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.chart em{font-style:normal;font-size:12px;font-weight:700;min-height:16px}
.chart i{display:block;width:100%;max-width:34px;border-radius:6px 6px 0 0;background:#9DB094}
.chart .now i{background:var(--green)}
.chart span{font-size:10.5px;color:var(--muted);padding-bottom:5px;white-space:nowrap}
.a-title{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.12em;text-transform:uppercase;margin:24px 0 8px}
.toprow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0}
.toprow .rk{font-family:var(--display);font-size:20px;font-weight:600;color:var(--muted);text-align:center}
.toprow .nm{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.toprow .nm i{display:block;height:5px;border-radius:3px;background:var(--green);margin-top:4px;min-width:6px}
.toprow b{font-variant-numeric:tabular-nums}
.ord{border-bottom:1px solid var(--line)}
.ord summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;cursor:pointer;font-size:14px}
.ord summary::-webkit-details-marker{display:none}
.ord summary small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.ord summary>b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ord-in{padding:0 0 14px}
.a-acts .pill{border:1px solid var(--wa);color:var(--wa);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;text-decoration:none;min-height:34px;display:inline-flex;align-items:center}
.btn[disabled]{opacity:.6}
.photo-pick{display:flex;align-items:center;gap:12px}
.photo-pick .ph{width:76px;height:76px;flex:none;font-size:30px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:13.5px;max-width:calc(100% - 32px);text-align:center;animation:fadein .2s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="cap" aria-hidden="true"></div>

function portoNow(){
  try{var parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Lisbon",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()),o={};
    parts.forEach(function(p){o[p.type]=p.value;});
    var d=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(o.weekday);
    if(d<0)throw 0;return{day:d,min:(parseInt(o.hour,10)%24)*60+parseInt(o.minute,10)};
  }catch(e){var n=new Date();return{day:n.getDay(),min:n.getHours()*60+n.getMinutes()};}
}
function openState(){
  var n=portoNow(),h=HOURS[n.day];
  if(h&&n.min>=h[0]*60&&n.min<h[1]*60)return{open:true,text:t("openUntil").replace("{h}",hh(h[1]*60))};
  if(h&&n.min<h[0]*60)return{open:false,text:t("closedOpens").replace("{h}",hh(h[0]*60))};
  for(var k=1;k<=7;k++){var d=(n.day+k)%7;if(HOURS[d])return{open:false,text:t("closedOpensDay").replace("{d}",t("days")[d]).replace("{h}",hh(HOURS[d][0]*60))};}
  return{open:false,text:t("closedDay")};
}
function slots(){ // créneaux tous les quarts d'heure, sur le jour d'ouverture en cours ou le prochain
  var n=portoNow(),out=[];
  for(var k=0;k<=7&&!out.length;k++){
    var d=(n.day+k)%7,h=HOURS[d];if(!h)continue;
    var start=h[0]*60+15,end=h[1]*60-15;
    if(k===0)start=Math.max(start,Math.ceil((n.min+20)/15)*15);
    for(var m=start;m<=end;m+=15)out.push((k===0?"":t("days")[d]+" ")+hh(m));
  }
  return out;
}

function makeTicket(){
  readForm();
  if(!customer.first||!customer.last)return renderCart(t("errName"));
  if(customer.phone.replace(/\D/g,"").length<6)return renderCart(t("errPhone"));
  if(customer.mode==="delivery"&&!customer.address)return renderCart(t("errAddr"));
  var d=new Date(),p2=function(n){return(n<10?"0":"")+n;};
  order={no:"K"+p2(d.getDate())+p2(d.getMonth()+1)+"-"+Math.random().toString(36).slice(2,6).toUpperCase(),
    stamp:d.toLocaleString(LOCALE[lang],{dateStyle:"short",timeStyle:"short"}),
    how:modeLabel(customer.mode)+(customer.mode==="delivery"?" : "+customer.address:"")+", "+(customer.when?t("forT")+" "+customer.when:t("asap").toLowerCase()),
    lines:cartLines(),total:cartTotal(),both:hasSec("shop")&&hasSec("resto")};
  renderTicket();showSheet("ticketSheet");
}
function orderText(){
  var o=order,A=[],last="";

    if(o.both&&l.p.sec!==last){last=l.p.sec;A.push("");A.push("_"+t(last)+"_");}else if(!last){last=l.p.sec;A.push("");}
    A.push(l.q+" x "+full(l.p)+" = "+money(l.q*l.p.price));
  });
  A.push("");A.push("*"+t("total")+" : "+money(o.total)+"*");

/* ---------- espace gérant (en français) ---------- */
function moneyFr(n){try{return new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(n);}catch(e){return Number(n).toFixed(2)+" €";}}
function p2(n){return(n<10?"0":"")+n;}
function waNum(ph){var raw=String(ph||""),d=raw.replace(/\D/g,"");if(/^\s*\+/.test(raw))return d;if(d.indexOf("00")===0)return d.slice(2);if(d.length===9&&d.charAt(0)==="9")return"351"+d;if(d.length===10&&d.charAt(0)==="0")return"33"+d.slice(1);return d;}
function mgrFail(e){
  busy=false;
  if(e&&(e.status===401||e.status===403)){tok=null;adminOk=false;editing=null;renderAdmin("Session expirée : entrez à nouveau le code.");}
  else{toast("Connexion impossible pour le moment. Réessayez.");renderAdmin();}
}
function signIn(code){
  if(!code)return renderAdmin("Entrez le code gérant.");

  busy=true;renderAdmin();
  api("/auth/v1/token?grant_type=password",{method:"POST",body:{email:CONFIG.email,password:code}}).then(
    function(r){busy=false;if(r&&r.access_token){tok=r.access_token;adminOk=true;afterLogin();}else renderAdmin("Code incorrect.");},
    function(e){busy=false;renderAdmin(e&&e.status?"Code incorrect.":"Pas de connexion. Réessayez.");});

function afterLogin(){adminTab="orders";renderAdmin();loadOrders();}

function startOfWeek(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function ordersHtml(){
  if(orders===null)return'<p class="hint">Chargement des commandes…</p>';
  var now=new Date(),w0=startOfWeek(now),m0=new Date(now.getFullYear(),now.getMonth(),1),d30=new Date(now.getTime()-30*864e5);
  var wk={n:0,s:0},mo={n:0,s:0},bk=[],i,top={};
  if(statMode==="week"){for(i=7;i>=0;i--){var a=new Date(w0);a.setDate(a.getDate()-7*i);var b=new Date(a);b.setDate(b.getDate()+7);bk.push({a:a,b:b,n:0,label:p2(a.getDate())+"/"+p2(a.getMonth()+1)});}}
  else{for(i=5;i>=0;i--){bk.push({a:new Date(now.getFullYear(),now.getMonth()-i,1),b:new Date(now.getFullYear(),now.getMonth()-i+1,1),n:0,label:new Date(now.getFullYear(),now.getMonth()-i,1).toLocaleDateString("fr-FR",{month:"short"})});}}
  orders.forEach(function(o){
    var d=new Date(o.created_at),tt=Number(o.total)||0;
    if(d>=w0){wk.n++;wk.s+=tt;}if(d>=m0){mo.n++;mo.s+=tt;}
    bk.forEach(function(k){if(d>=k.a&&d<k.b)k.n++;});
    if(d>=d30)(o.lines||[]).forEach(function(l){top[l.name]=(top[l.name]||0)+(Number(l.q)||0);});
  });
  var max=Math.max.apply(null,bk.map(function(k){return k.n;}).concat([1]));
  var h='<div class="tiles"><div class="tile"><span>Cette semaine</span><b>'+wk.n+'</b><small>'+(wk.n>1?"commandes":"commande")+", "+moneyFr(wk.s)+'</small></div><div class="tile"><span>Ce mois-ci</span><b>'+mo.n+'</b><small>'+(mo.n>1?"commandes":"commande")+", "+moneyFr(mo.s)+'</small></div></div>';
  h+='<div class="seg" role="group" style="margin-top:16px"><button data-stat="week" aria-pressed="'+(statMode==="week")+'">Par semaine</button><button data-stat="month" aria-pressed="'+(statMode==="month")+'">Par mois</button></div>';
  h+='<div class="chart" role="img" aria-label="Nombre de commandes '+(statMode==="week"?"par semaine":"par mois")+'">'+bk.map(function(k,idx){return'<div class="col'+(idx===bk.length-1?" now":"")+'"><em>'+(k.n||"")+'</em><i style="height:'+Math.max(3,Math.round(k.n/max*92))+'px"></i><span>'+esc(k.label)+'</span></div>';}).join("")+'</div>';
  h+='<p class="hint" style="text-align:center;margin-top:4px">'+(statMode==="week"?"Commandes par semaine (la date est celle du lundi)":"Commandes par mois")+'</p>';
  var tops=Object.keys(top).map(function(n){return{n:n,q:top[n]};}).sort(function(x,y){return y.q-x.q;}).slice(0,5);
  h+='<h3 class="a-title">Les 5 plus vendus</h3><p class="hint" style="margin:-4px 0 6px">Sur les 30 derniers jours, en quantité.</p>';
  h+=tops.length?tops.map(function(x,idx){return'<div class="toprow"><span class="rk">'+(idx+1)+'</span><span class="nm">'+esc(x.n)+'<i style="width:'+Math.round(x.q/tops[0].q*100)+'%"></i></span><b>'+x.q+'</b></div>';}).join(""):'<p class="hint">Pas encore de vente sur cette période.</p>';
  h+='<h3 class="a-title">Dernières commandes</h3>';
  if(!orders.length)h+='<p class="hint">Aucune commande pour le moment. Elles apparaissent ici dès qu\'un client touche « Envoyer sur WhatsApp ».</p>';

    var ready="https://wa.me/"+waNum(o.phone)+"?text="+encodeURIComponent("Bonjour "+first+", votre commande "+o.no+" est prête. À tout de suite ! O\u2019Kaffé & O\u2019Kasher");
    return'<details class="ord"><summary><span><b>'+esc(o.customer_name)+'</b><small>'+p2(d.getDate())+"/"+p2(d.getMonth()+1)+" à "+p2(d.getHours())+":"+p2(d.getMinutes())+", "+esc(how)+'</small></span><b>'+moneyFr(Number(o.total)||0)+'</b></summary>'
      +'<div class="ord-in"><p class="sub">Commande '+esc(o.no)+", "+esc(o.phone)+'</p>'+(o.lines||[]).map(function(l){return'<div class="t-row"><span>'+esc(l.q)+' ×</span><span>'+esc(l.name)+'</span><span>'+moneyFr((Number(l.q)||0)*(Number(l.price)||0))+'</span></div>';}).join("")
      +(o.note?'<p class="sub">Remarque : '+esc(o.note)+'</p>':'')
      +'<div class="a-acts"><a class="pill" href="'+esc(ready)+'" target="_blank" rel="noopener">Prévenir que c\'est prêt</a><button class="del" data-act="o-del" data-id="'+esc(o.id)+'">Supprimer</button></div></div></details>';
  }).join("");
  return h;

    h+='<label class="field"><span>Livraison</span><select id="s-del"><option value="0"'+(settings.delivery?"":" selected")+'>Sur place et à emporter uniquement</option><option value="1"'+(settings.delivery?" selected":"")+'>Proposer aussi la livraison</option></select></label>';
    h+='<label class="field"><span>Nouveau code gérant (laisser vide pour garder l\'actuel)</span><input id="s-code" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></label>';
    if(err)h+='<p class="err" role="alert">'+esc(err)+'</p>';
    h+='<button class="btn primary" data-act="s-save"'+(busy?" disabled":"")+'>'+(busy?"Enregistrement…":"Enregistrer les réglages")+'</button>';
    if(!ONLINE)h+='<button class="btn danger" data-act="reset">Remettre le catalogue d\'origine</button>';
  }
  $("#adminBody").innerHTML=h;
}
function formHtml(err){
  var p=editing,img=draftImg!==null?draftImg:p.img,resto=p.sec==="resto";
  var h='<div class="photo-pick"><div class="ph">'+(img?'<img src="'+esc(img)+'" alt="">':'<span aria-hidden="true">📷</span>')+'</div><div style="flex:1"><label class="btn ghost" style="margin:0;cursor:pointer">'+(img?"Changer la photo":"Prendre ou choisir une photo")+'<input id="p-file" type="file" accept="image/*" hidden></label></div></div>';
  h+='<label class="field"><span>'+(resto?"Nom du plat":"Nom du produit")+'</span><input id="p-name" value="'+esc(p.id?tx(p.name,"fr"):"")+'"></label>';
  h+='<div class="two"><label class="field"><span>Prix en euros</span><input id="p-price" inputmode="decimal" value="'+(p.id?String(p.price).replace(".",","):"")+'"></label><label class="field"><span>Ancien prix (promo)</span><input id="p-was" inputmode="decimal" value="'+(p.was?String(p.was).replace(".",","):"")+'"></label></div>';
  h+='<label class="field"><span>'+(resto?"Description (ingrédients)":"Format (500 g, la pièce…)")+'</span><input id="p-sub" value="'+esc(p.id?tx(p.sub,"fr"):"")+'"></label>';
  h+='<label class="field"><span>Rubrique</span><select id="p-cat">'+CATS[p.sec].map(function(c){return'<option value="'+c+'"'+(p.cat===c?" selected":"")+'>'+CAT_L[c][0]+'</option>';}).join("")+'</select></label>';
  if(err)h+='<p class="err" role="alert">'+esc(err)+'</p>';
  h+='<button class="btn primary" data-act="p-save"'+(busy?" disabled":"")+'>'+(busy?"Enregistrement…":"Enregistrer")+'</button><button class="btn ghost" data-act="back">Annuler</button>';
  return h;
}
function keepDraft(){var n=$("#p-name");if(!n||!editing)return;editing._d=[n.value,$("#p-price").value,$("#p-was").value,$("#p-sub").value];editing.cat=$("#p-cat").value;}
function restoreDraft(){if(!editing||!editing._d||!$("#p-name"))return;$("#p-name").value=editing._d[0];$("#p-price").value=editing._d[1];$("#p-was").value=editing._d[2];$("#p-sub").value=editing._d[3];}
function pickPhoto(file){
  if(!file)return;var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var sd=Math.min(im.width,im.height),side=Math.min(560,sd),c=document.createElement("canvas");c.width=side;c.height=side;
    c.getContext("2d").drawImage(im,(im.width-sd)/2,(im.height-sd)/2,sd,sd,0,0,side,side);
    keepDraft();draftImg=c.toDataURL("image/jpeg",.72);renderAdmin();restoreDraft();
  };im.onerror=function(){toast("Photo illisible, essayez-en une autre.");};im.src=r.result;};
  r.readAsDataURL(file);
}
function num(v){var n=parseFloat(String(v).replace(",","."));return n>0?Math.round(n*100)/100:0;}
function uploadPhoto(dataUrl,id){ // envoie la photo dans le stockage en ligne ; en cas d'échec on garde l'image dans la fiche
  try{
    var bin=atob(dataUrl.split(",")[1]),arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    var name=id+"-"+Date.now().toString(36)+".jpg";
    return api("/storage/v1/object/photos/"+name,{method:"POST",raw:true,body:new Blob([arr],{type:"image/jpeg"}),headers:{"Content-Type":"image/jpeg","x-upsert":"true"}},tok)
      .then(function(){return CONFIG.url+"/storage/v1/object/public/photos/"+name;},function(e){if(e&&(e.status===401||e.status===403))throw e;return dataUrl;});
  }catch(e){return Promise.resolve(dataUrl);}
}
function persistItem(p){ // renvoie une promesse
  if(!ONLINE)return Promise.resolve();
  return api("/rest/v1/items?on_conflict=id",{method:"POST",body:[toRow(p)],headers:{Prefer:"resolution=merge-duplicates,return=minimal"}},tok);
}
function putItem(p){var i=items.findIndex(function(x){return x.id===p.id;});if(i>=0)items[i]=p;else items.push(p);}
function saveProduct(){
  var name=$("#p-name").value.trim(),price=num($("#p-price").value),was=num($("#p-was").value);
  if(!name){keepDraft();renderAdmin("Donnez un nom.");restoreDraft();return;}
  if(!price){keepDraft();renderAdmin("Indiquez un prix, par exemple 4,50.");restoreDraft();return;}
  var old=editing.id?byId(editing.id):null,p=old?Object.assign({},old):{id:"n"+Date.now().toString(36),sec:editing.sec,emoji:editing.sec==="shop"?"🛒":"",img:"",on:true,pos:items.reduce(function(m,x){return Math.max(m,x.pos||0);},0)+1};
  if(!old||tx(old.name,"fr")!==name)p.name=name;
  var sub=$("#p-sub").value.trim();if(!old||tx(old.sub,"fr")!==sub)p.sub=sub;
  p.price=price;p.cat=$("#p-cat").value;if(was>price)p.was=was;else delete p.was;
  keepDraft();busy=true;renderAdmin();restoreDraft();
  var step=(draftImg!==null&&ONLINE)?uploadPhoto(draftImg,p.id):Promise.resolve(draftImg);
  step.then(function(img){if(img!==null)p.img=img;return persistItem(p);}).then(function(){
    busy=false;putItem(p);
    if(!save("catalog",items)&&!ONLINE){toast("Mémoire de l'appareil pleine : retirez des photos.");}
    editing=null;draftImg=null;renderAdmin();refresh();toast("Enregistré");
  },mgrFail);
}
function refresh(){renderStatic();renderList();renderBar();}

/* ---------- événements ---------- */
var delArm=null;
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act],[data-lang],[data-cat],[data-mode],[data-tab],[data-sec],[data-stat]");if(!el)return;
  if(el.dataset.stat){statMode=el.dataset.stat;renderAdmin();return;}
  if(el.dataset.lang){lang=el.dataset.lang;save("lang",lang);refresh();if(!$("#cartSheet").hidden){readForm();renderCart();}return;}
  if(el.dataset.sec){setSec(el.dataset.sec,el.dataset.sec==="resto"?-1:1);return;}
  if(el.dataset.cat){cat=el.dataset.cat;renderStatic();renderList("fade");
    var b=$('#chips [aria-pressed="true"]');if(b&&b.scrollIntoView)b.scrollIntoView({inline:"center",block:"nearest"});
    var top=$("#main").offsetTop-$('.top').offsetHeight+50;if(window.scrollY>top)window.scrollTo(0,top);return;}
  if(el.dataset.mode){readForm();customer.mode=el.dataset.mode;save("customer",customer);renderCart();return;}
  if(el.dataset.tab){adminTab=el.dataset.tab;delArm=null;if(adminTab==="orders")loadOrders();else renderAdmin();return;}
  var a=el.dataset.act,id=el.dataset.id;
  if(a==="inc"||a==="dec"){if(!$("#cartSheet").hidden)readForm();changeQty(id,a==="inc"?1:-1,el.closest("[data-card]")?"grid":"cart");}
  else if(a==="open-cart"){renderCart();showSheet("cartSheet");}
  else if(a==="close")closeSheets();
  else if(a==="back")goBack();
  else if(a==="make-ticket")makeTicket();
  else if(a==="copy")copyOrder();
  else if(a==="sent")recordOrder();
  else if(a==="new-order"){cart={};save("cart",cart);customer.note="";customer.when="";save("customer",customer);order=null;closeSheets();}
  else if(a==="open-admin"){renderAdmin();showSheet("adminSheet");if(adminOk&&adminTab==="orders")loadOrders();}
  else if(a==="pin-ok"){if(!busy)signIn(normCode($("#pin").value));}
  else if(a==="p-new"){if(adminTab!=="shop"&&adminTab!=="resto")return;editing={id:"",sec:adminTab,cat:CATS[adminTab][0],img:""};draftImg=null;renderAdmin();$("#adminSheet").scrollTop=0;}
  else if(a==="p-edit"){var p=byId(id);editing=Object.assign({},p);delete editing._d;draftImg=null;renderAdmin();$("#adminSheet").scrollTop=0;}
  else if(a==="p-save"){if(!busy)saveProduct();}
  else if(a==="p-toggle"){var pt=Object.assign({},byId(id));pt.on=!pt.on;persistItem(pt).then(function(){putItem(pt);save("catalog",items);renderAdmin();refresh();},mgrFail);}
  else if(a==="p-del"){
    if(delArm!==id){delArm=id;el.textContent="Confirmer la suppression";return;}
    delArm=null;
    (ONLINE?api("/rest/v1/items?id=eq."+encodeURIComponent(id),{method:"DELETE"},tok):Promise.resolve()).then(function(){
      items=items.filter(function(x){return x.id!==id;});delete cart[id];save("catalog",items);save("cart",cart);renderAdmin();refresh();toast("Supprimé");},mgrFail);
  }
  else if(a==="o-del"){
    if(delArm!=="o"+id){delArm="o"+id;el.textContent="Confirmer la suppression";return;}
    delArm=null;
    if(!ONLINE){orders=load("orders",[]).filter(function(o){return String(o.id)!==String(id);});save("orders",orders);renderAdmin();return;}
    api("/rest/v1/orders?id=eq."+encodeURIComponent(id),{method:"DELETE"},tok).then(function(){orders=(orders||[]).filter(function(o){return String(o.id)!==String(id);});renderAdmin();toast("Commande supprimée");},mgrFail);
  }
  else if(a==="s-save"){
    var code=normCode($("#s-code").value);
    if(code&&code.length<8)return renderAdmin("Le code gérant doit faire au moins 8 caractères.");
    var ns={wa:$("#s-wa").value.replace(/\D/g,""),phone:$("#s-phone").value.trim(),address:$("#s-addr").value.trim(),delivery:$("#s-del").value==="1"};
    if(ns.wa.length<8)return renderAdmin("Le numéro WhatsApp semble incomplet.");
    var done=function(){busy=false;Object.assign(settings,ns);if(code&&!ONLINE)settings.code=hash(code);save("settings",settings);renderAdmin();refresh();toast("Réglages enregistrés");};
    if(!ONLINE)return done();
    busy=true;renderAdmin();
    api("/rest/v1/settings?id=eq.1",{method:"PATCH",body:ns,headers:{Prefer:"return=minimal"}},tok)
      .then(function(){return code?api("/auth/v1/user",{method:"PUT",body:{password:code}},tok):null;}).then(done,mgrFail);
  }
  else if(a==="reset"){
    if(delArm!=="reset"){delArm="reset";el.textContent="Confirmer : le catalogue actuel sera remplacé";return;}
    delArm=null;items=SEED.map(function(x){return Object.assign({},x);});cart={};save("catalog",items);save("cart",cart);renderAdmin();refresh();toast("Catalogue d'origine remis");
  }
});
document.addEventListener("change",function(e){if(e.target.id==="p-file")pickPhoto(e.target.files[0]);else if(e.target.id==="f-when"){customer.when=e.target.value;save("customer",customer);}});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="pin"){e.preventDefault();$('[data-act="pin-ok"]').click();}
  if(e.key==="Escape"&&anySheet())goBack();
});
$("#q").addEventListener("input",function(e){query=e.target.value;renderList();});

/* balayage : gauche/droite change de rayon, vers la droite revient en arrière dans une feuille */
var sx=null,sy=0,st=0;
document.addEventListener("touchstart",function(e){
  if(e.touches.length!==1||e.target.closest(".chips,input,textarea,select")){sx=null;return;}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();
},{passive:true});
document.addEventListener("touchend",function(e){
  if(sx===null)return;var c=e.changedTouches[0],dx=c.clientX-sx,dy=c.clientY-sy;sx=null;
  if(Math.abs(dx)<64||Math.abs(dx)<Math.abs(dy)*1.8||Date.now()-st>700)return;
  if(anySheet()){if(dx>0)goBack();return;}
  if(dx<0&&sec==="shop")setSec("resto",-1);else if(dx>0&&sec==="resto")setSec("shop",1);
},{passive:true});
document.addEventListener("touchcancel",function(){sx=null;},{passive:true});

function topH(){document.documentElement.style.setProperty('--top-h',($('.top').offsetHeight-1)+'px');}
window.addEventListener('resize',topH);topH();
setInterval(function(){if(!anySheet())renderStatic();},60000); // garde « ouvert / fermé » à jour
refresh();
syncDown();
})();
</script>
</body>
</html>
